name: Publica el web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Genera el web
        env:
          # Mentre el web és a utacub.github.io/web-utac cal el prefix /web-utac.
          # Quan www.utac.cat apunti a GitHub: SITE_BASE: '' i CUSTOM_DOMAIN: www.utac.cat
          SITE_BASE: /web-utac
          CUSTOM_DOMAIN: ''
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  - name: menu
    label: Menú del web
    description: Seccions i subpàgines del menú. Quan creeu una pàgina nova, afegiu-la aquí perquè aparegui al menú.
    type: file
    path: data/menu.yaml
    format: yaml
    fields:
      - name: menu
        label: Seccions
        type: object
        list:

                - { value: descarrega, label: Descàrrega }
                - { value: persones, label: Persones }
                - { value: video, label: Vídeo }
                - { value: tauleta, label: Tauleta }
                - { value: commutador, label: Commutador }
                - { value: web, label: Globus (web) }
                - { value: llibre, label: Llibre }
          - name: fills
            label: Subpàgines
            type: object
            list:
              collapsible: { collapsed: true, summary: "{titol}" }
            fields:
              - name: titol
                label: Nom
                type: string
              - name: titol_es
                label: Nom en castellà
                type: string
              - name: titol_en
                label: Nom en anglès
                type: string
              - name: url
                label: Adreça
                type: string
              - name: fills
                label: Subpàgines de segon nivell
                type: object
                list: true
                fields:
                  - name: titol
                    label: Nom
                    type: string
                  - name: titol_es
                    label: Nom en castellà
                    type: string
                  - name: titol_en
                    label: Nom en anglès
                    type: string
                  - name: url
                    label: Adreça
                    type: string


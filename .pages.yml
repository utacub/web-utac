        fields:
          - name: titol
            label: Nom de la secció
            type: string
          - name: titol_es
            label: Nom de la secció en castellà
            type: string
          - name: titol_en
            label: Nom de la secció en anglès
            type: string
          - name: url
            label: Adreça (p. ex. /equip)
            type: string
          - name: icona
            label: Icona
            type: select
            options:
              values:
                - { value: casa, label: Casa }
                - { value: contacte, label: Bafarada (contacte) }
